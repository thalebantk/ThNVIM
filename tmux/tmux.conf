is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# --- Neovim / moonfly integration -------------------------------------------

# True colour, plus underline styles so clangd's undercurl diagnostics survive
# tmux. tmux 3.7 already defaults escape-time to 10 and default-terminal to
# tmux-256color, so those are deliberately not repeated here.
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"

# Let Neovim see FocusGained/FocusLost (:autoread, :checktime).
set -g focus-events on

# moonfly's own tmux theme, sourced straight out of the colorscheme plugin so
# tmux and Neovim can never drift apart in palette. Guarded, so this is a
# no-op if the plugin is not installed yet.
if-shell '[ -r "$HOME/.local/share/nvim/lazy/moonfly/extras/moonfly.tmux" ]' \
    'source-file "$HOME/.local/share/nvim/lazy/moonfly/extras/moonfly.tmux"'
